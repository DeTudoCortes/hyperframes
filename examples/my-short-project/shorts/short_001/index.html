<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ===== CAMADA 0: VÍDEO (CORPO) ===== */
    #body-video {
      position: absolute;
      top: 35%;
      left: 0;
      width: 100%;
      height: 65%;
      object-fit: cover;
      object-position: center 60%;
      z-index: 1;
    }

    /* ===== CAMADA 1: IMAGENS DOS PERSONAGENS (TOPO) ===== */
    #characters {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 35%;
      display: flex;
      flex-direction: row;
      z-index: 3;
      overflow: hidden;
      gap: 0;
    }
    #characters > div {
      width: 50%;
      height: 100%;
      overflow: hidden;
      position: relative;
      margin: 0;
      padding: 0;
      flex: 0 0 50%;
      max-width: 50%;
    }
    #characters img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
    }
    #char-left {
      object-position: center 30%;
      transform: translateX(8%) scale(1.15);
      transform-origin: center center;
    }
    #char-right {
      object-position: center 30%;
      transform: translateX(15%) scale(1.15);
      transform-origin: center center;
    }

    /* ===== CAMADA 2: HEADLINE ===== */
    #headline {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      background: #FF0000;
      color: #FFFFFF;
      text-align: center;
      padding: 22px 32px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      border-radius: 18px;
      z-index: 4;
      text-shadow:
        2px 2px 0 #000,
        -2px 2px 0 #000,
        2px -2px 0 #000,
        -2px -2px 0 #000,
        0 4px 12px rgba(0,0,0,0.6);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }

    /* ===== CAMADA 3: LEGENDAS TIKTOK ===== */
    #captions-layer {
      position: absolute;
      top: 62%;
      left: 0;
      width: 100%;
      z-index: 5;
      pointer-events: none;
    }
    .caption-group {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      opacity: 0;
    }
    .caption-word {
      position: relative;
      display: inline-block;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 900;
      font-size: 64px;
      color: #FFFFFF;
      text-transform: uppercase;
      line-height: 1.2;
      text-shadow:
        2px 2px 0 #000,
        -2px 2px 0 #000,
        2px -2px 0 #000,
        -2px -2px 0 #000,
        0 4px 16px rgba(0,0,0,0.9);
      padding: 6px 12px;
    }
    .caption-word .hl-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ff1745 0%, #df1238 100%);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(229, 20, 58, 0.32);
      transform: scaleX(0);
      transform-origin: left center;
      z-index: -1;
    }
    .caption-word .hl-text {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

    captionBlocks.forEach((block, blockIndex) => {
      const group = document.createElement('div');
      group.className = 'caption-group';
      group.id = 'caption-' + (blockIndex + 1);
      group.dataset.start = block.start_ms / 1000;
      group.dataset.duration = (block.end_ms - block.start_ms) / 1000;

      const words = block.words;
      const wordDuration = (block.end_ms - block.start_ms) / words.length / 1000;

      words.forEach((word, i) => {
        const wordEl = document.createElement('span');
        wordEl.className = 'caption-word';
        wordEl.innerHTML = '<span class="hl-bg"></span><span class="hl-text">' + word + '</span>';
        group.appendChild(wordEl);

        const wordStart = block.start_ms / 1000 + i * wordDuration;
        const wordEnd = wordStart + wordDuration;

        tl.fromTo(wordEl,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" },
          wordStart
        );

        tl.to(wordEl.querySelector('.hl-bg'),
          { scaleX: 1, duration: 0.15, ease: "power2.out" },
          wordStart
        );

        if (i < words.length - 1) {
          tl.to(wordEl.querySelector('.hl-bg'),
            { scaleX: 0, duration: 0.1, ease: "power2.in" },
            wordEnd
          );
        }
      });

      const groupStart = block.start_ms / 1000;
      const groupEnd = block.end_ms / 1000;

      tl.set(group, { opacity: 1 }, groupStart);
      tl.set(group, { opacity: 0, visibility: "hidden" }, groupEnd);

      document.getElementById('captions-layer').appendChild(group);
    });

    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
