name: Deploy and Render HyperFrames Lambda

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: 'Caminho do projeto dentro do repo'
        required: true
        default: 'examples/my-short-project'
      width:
        description: 'Largura em pixels'
        required: true
        default: '1080'
      height:
        description: 'Altura em pixels'
        required: true
        default: '1920'

permissions:
  contents: read

jobs:
  build-deploy-render:
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: ${{ inputs.project_path }}
      WIDTH: ${{ inputs.width }}
      HEIGHT: ${{ inputs.height }}
      STACK_NAME: hyperframes-lambda
      HYPERFRAMES_REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v1

      - name: Descobrir raiz do HyperFrames
        run: |
          set -euo pipefail

          candidates=(
            "$HYPERFRAMES_REPO_ROOT"
            "$GITHUB_WORKSPACE"
            "$(git rev-parse --show-toplevel 2>/dev/null || true)"
          )

          found=""
          for candidate in "${candidates[@]}"; do
            if [ -n "$candidate" ] && [ -d "$candidate/packages/aws-lambda" ]; then
              found="$candidate"
              break
            fi
          done

          if [ -z "$found" ]; then
            match="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type d -path '*/packages/aws-lambda' -not -path '*/node_modules/*' -not -path '*/.git/*' -print 2>/dev/null | head -n 1 || true)"
            if [ -n "$match" ]; then
              found="$(dirname "$(dirname "$match")")"
            fi
          fi

          if [ -z "$found" ]; then
            echo "::error::Não encontrei packages/aws-lambda a partir de $GITHUB_WORKSPACE."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type d -name aws-lambda -not -path '*/node_modules/*' -not -path '*/.git/*' -print || true
            exit 1
          fi

          if [ ! -f "$found/package.json" ]; then
            echo "::warning::$found não possui package.json. Continuando para ver se o monorepo ainda funciona."
          fi

          abs_project_path="$PROJECT_PATH"
          case "$abs_project_path" in
            /*)
              ;;
            *)
              abs_project_path="$found/$PROJECT_PATH"
              ;;
          esac

          if [[ "$abs_project_path" == "$GITHUB_WORKSPACE"/* ]]; then
            artifact_render_path="${abs_project_path#$GITHUB_WORKSPACE/}/renders/**/*.mp4"
          else
            artifact_render_path="$abs_project_path/renders/**/*.mp4"
          fi

          echo "HYPERFRAMES_REPO_ROOT=$found" >> "$GITHUB_ENV"
          echo "ABS_PROJECT_PATH=$abs_project_path" >> "$GITHUB_ENV"
          echo "ARTIFACT_RENDER_PATH=$artifact_render_path" >> "$GITHUB_ENV"

          echo "Raiz detectada do HyperFrames: $found"
          echo "Caminho absoluto do projeto: $abs_project_path"
          echo "Caminho do artifact: $artifact_render_path"

      - name: Instalar dependências
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"
          bun install

      - name: Build do monorepo
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"
          bun run build

      - name: Instalar HyperFrames CLI e Lambda adapter
        run: |
          set -euo pipefail
          npm install -g hyperframes@latest
          npm install -g @hyperframes/aws-lambda@latest
          hyperframes --version

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Exportar AWS_REGION para os próximos passos
        run: |
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"

      - name: Gerar arquivo de estado do HyperFrames
        run: |
          set -euo pipefail
          mkdir -p "$HYPERFRAMES_REPO_ROOT/.hyperframes"

          bucket="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderBucketName`].OutputValue' \
            --output text)"

          state_machine_arn="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderStateMachineArn`].OutputValue' \
            --output text)"

          function_arn="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderFunctionArn`].OutputValue' \
            --output text)"

          cat > "$HYPERFRAMES_REPO_ROOT/.hyperframes/lambda-stack-$STACK_NAME.json" <<EOF
          {
            "stackName": "$STACK_NAME",
            "region": "$AWS_REGION",
            "stateMachineArn": "$state_machine_arn",
            "bucketName": "$bucket",
            "functionArn": "$function_arn"
          }
          EOF

          echo "Arquivo de estado gerado:"
          cat "$HYPERFRAMES_REPO_ROOT/.hyperframes/lambda-stack-$STACK_NAME.json"

      - name: Baixar video_teste.mp4 do S3
        run: |
          set -euo pipefail

          bucket="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderBucketName`].OutputValue' \
            --output text)"

          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "::error::Output RenderBucketName não encontrado na stack $STACK_NAME."
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" || true
            exit 1
          fi

          mkdir -p "$ABS_PROJECT_PATH/assets"
          aws s3 cp "s3://$bucket/assets/video_teste.mp4" "$ABS_PROJECT_PATH/assets/video_teste.mp4"

      - name: Renderizar via Lambda
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"

          hyperframes lambda render "$ABS_PROJECT_PATH" \
            --stack-name="$STACK_NAME" \
            --region="$AWS_REGION" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --fps 30 \
            --format mp4 \
            --wait --json | tee render-output.json

      - name: Baixar o MP4 renderizado do S3
        run: |
          set -euo pipefail

          bucket="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderBucketName`].OutputValue' \
            --output text)"

          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "::error::Output RenderBucketName não encontrado na stack $STACK_NAME."
            exit 1
          fi

          mkdir -p "$ABS_PROJECT_PATH/renders"
          aws s3 cp "s3://$bucket/renders/" "$ABS_PROJECT_PATH/renders/" \
            --recursive --exclude "*" --include "*.mp4"

          if ! find "$ABS_PROJECT_PATH/renders" -type f -name '*.mp4' | grep -q .; then
            echo "::error::Nenhum arquivo .mp4 foi baixado para $ABS_PROJECT_PATH/renders."
            exit 1
          fi

      - name: Upload do MP4 final
        uses: actions/upload-artifact@v4
        with:
          name: short-render
          path: ${{ env.ARTIFACT_RENDER_PATH }}
          retention-days: 7