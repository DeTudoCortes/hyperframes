name: Deploy and Render HyperFrames Lambda

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Caminho do projeto dentro do repo"
        required: true
        default: "examples/my-short-project"
      width:
        description: "Largura em pixels"
        required: true
        default: "1080"
      height:
        description: "Altura em pixels"
        required: true
        default: "1920"

permissions:
  contents: read

jobs:
  build-deploy-render:
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: ${{ inputs.project_path }}
      WIDTH: ${{ inputs.width }}
      HEIGHT: ${{ inputs.height }}
      STACK_NAME: hyperframes-lambda
      HYPERFRAMES_REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          lfs: true
          # Se quiser travar em uma tag específica, descomente e ajuste o nome exato da tag:
          # ref: 0.8.179

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v1

      - name: Detectar versão do HyperFrames no código local
        id: get_version
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"
          # Lê a versão do package.json da CLI (ou do root, como fallback)
          VERSION=$(node -p "require('./packages/cli/package.json').version" 2>/dev/null || node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Versão detectada no código: $VERSION"

      - name: Descobrir raiz do HyperFrames
        id: discover
        run: |
          set -euo pipefail
          found=""
          for candidate in "$HYPERFRAMES_REPO_ROOT" "$GITHUB_WORKSPACE"; do
            if [ -n "$candidate" ] && [ -d "$candidate/packages/aws-lambda" ]; then
              found="$candidate"
              break
            fi
          done
          if [ -z "$found" ]; then
            found="$GITHUB_WORKSPACE"
          fi
          abs_project_path="$PROJECT_PATH"
          case "$abs_project_path" in
            /*) ;;
            *) abs_project_path="$found/$PROJECT_PATH" ;;
          esac
          if [ "${abs_project_path#"$GITHUB_WORKSPACE/"}" != "$abs_project_path" ]; then
            artifact_render_path="${abs_project_path#"$GITHUB_WORKSPACE/"}/renders/**/*.mp4"
          else
            artifact_render_path="$abs_project_path/renders/**/*.mp4"
          fi
          echo "HYPERFRAMES_REPO_ROOT=$found" >> "$GITHUB_ENV"
          echo "ABS_PROJECT_PATH=$abs_project_path" >> "$GITHUB_ENV"
          echo "ARTIFACT_RENDER_PATH=$artifact_render_path" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"
          bun install

      - name: Build do monorepo
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"
          bun run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Limpar stack presa em rollback, se houver
        run: |
          set -euo pipefail
          status=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "us-east-1" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$status" = "ROLLBACK_COMPLETE" ] || [ "$status" = "ROLLBACK_FAILED" ]; then
            echo "⚠️ Stack em $status — deletando antes de recriar."
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "us-east-1"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "us-east-1"
          fi

      - name: Build do handler.zip
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"
          bun run --cwd packages/aws-lambda build:zip

      - name: Deploy via SAM (Idempotente)
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT/examples/aws-lambda"
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "us-east-1" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides ChromeSource=sparticuz ReservedConcurrency=-1 LambdaMemoryMb=2048

      - name: Limpar estados antigos do HyperFrames
        run: |
          set -euo pipefail
          cd "$HYPERFRAMES_REPO_ROOT"
          rm -rf .hyperframes/lambda-stack-*.json
          mkdir -p .hyperframes

      - name: Gerar arquivo de estado do HyperFrames
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "us-east-1" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderBucketName`].OutputValue' \
            --output text)"
          state_machine_arn="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "us-east-1" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderStateMachineArn`].OutputValue' \
            --output text)"
          function_arn="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "us-east-1" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderFunctionArn`].OutputValue' \
            --output text)"
          
          cat > "$HYPERFRAMES_REPO_ROOT/.hyperframes/lambda-stack-$STACK_NAME.json" <<EOF
          {
            "stackName": "$STACK_NAME",
            "region": "us-east-1",
            "stateMachineArn": "$state_machine_arn",
            "bucketName": "$bucket",
            "functionArn": "$function_arn"
          }
          EOF

      - name: Baixar short do S3
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "us-east-1" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderBucketName`].OutputValue' \
            --output text)"
          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "::error::Output RenderBucketName não encontrado na stack $STACK_NAME."
            exit 1
          fi
          short_id="$(basename "$ABS_PROJECT_PATH")"
          mkdir -p "$ABS_PROJECT_PATH"
          aws s3 sync "s3://$bucket/assets-source/$short_id/" "$ABS_PROJECT_PATH/"

      - name: Instalar HyperFrames CLI + Lambda adapter (versão sincronizada)
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "📦 Instalando globalmente a versão exata do código: $VERSION"
          npm install -g "hyperframes@$VERSION"
          npm install -g "@hyperframes/aws-lambda@$VERSION"
          
          # Verificação de sanidade
          installed=$(hyperframes --version)
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::CLI instalado ($installed) não bate com a versão esperada ($VERSION)."
            exit 1
          fi
          echo "✅ Versão do CLI confirmada: $installed"

      - name: Renderizar via Lambda (Binário Global)
        env:
          # Esvazia a variável para forçar o uso do binário global e evitar resolução local ambígua
          HYPERFRAMES_REPO_ROOT: ""
        run: |
          set -euo pipefail
          
          echo "📂 Stack configurada para render:"
          cat "$GITHUB_WORKSPACE/.hyperframes/lambda-stack-$STACK_NAME.json"
          
          hyperframes lambda render "$ABS_PROJECT_PATH" \
            --stack-name="$STACK_NAME" \
            --region="us-east-1" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --fps 30 \
            --format mp4 \
            --max-parallel-chunks=4 \
            --wait --json | tee render-output.json

      - name: Salvar UUID do render no S3
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "us-east-1" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderBucketName`].OutputValue' \
            --output text)"
          
          short_id="$(basename "$ABS_PROJECT_PATH")"
          
          # Extrai o UUID do render-output.json
          UUID=$(python -c "import json; d=json.load(open('render-output.json')); print(d.get('id') or d.get('renderId') or d.get('outputFile',{}).get('s3Uri','').split('/')[-2])" 2>/dev/null || echo "")
          
          if [ -z "$UUID" ] || [ "$UUID" = "None" ]; then
            echo "::warning::UUID não encontrado no render-output.json. Pulando."
          else
            echo "UUID do render: $UUID"
            echo "$UUID" | aws s3 cp - "s3://$bucket/shorts/$short_id/last_render.txt"
          fi
     
      - name: Baixar o MP4 renderizado do S3
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "us-east-1" \
            --query 'Stacks[0].Outputs[?OutputKey==`RenderBucketName`].OutputValue' \
            --output text)"
          mkdir -p "$ABS_PROJECT_PATH/renders"
          aws s3 cp "s3://$bucket/renders/" "$ABS_PROJECT_PATH/renders/" \
            --recursive --exclude "*" --include "*.mp4"
          
          mp4_count=$(find "$ABS_PROJECT_PATH/renders" -type f -name '*.mp4' | wc -l)
          if [ "$mp4_count" -eq 0 ]; then
            echo "::error::Nenhum arquivo .mp4 foi baixado."
            exit 1
          fi
          echo "✅ Total de .mp4 baixados: $mp4_count"

      - name: Upload do MP4 final
        uses: actions/upload-artifact@v4
        with:
          name: short-render-${{ github.run_id }}
          path: ${{ env.ARTIFACT_RENDER_PATH }}
          retention-days: 7